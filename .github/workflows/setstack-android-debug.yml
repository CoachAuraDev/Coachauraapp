name: Build SetStack debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.26.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK 36
        shell: bash
        run: node artifacts/setstack/scripts/setup-android-ci.mjs 2>&1 | tee "$RUNNER_TEMP/setstack-android-sdk.log"
      - name: Reuse the test signing key across builds
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: setstack-debug-keystore-${{ github.repository_id }}-v1
      - run: pnpm install --frozen-lockfile
      - name: Check calculation and data regressions
        run: |
          node --test artifacts/setstack/scripts/setup-android-ci.test.mjs
          pnpm --filter @workspace/setstack run test:unit
      - name: Build and sync the bundled web app
        run: pnpm --filter @workspace/setstack run android:sync
      - name: Build debug APK
        working-directory: artifacts/setstack/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/setstack-gradle.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Downloadable APK
        uses: actions/upload-artifact@v6
        with:
          name: SetStack-debug-APK
          path: artifacts/setstack/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Downloadable failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: SetStack-debug-build-logs
          path: |
            ${{ runner.temp }}/setstack-android-sdk.log
            ${{ runner.temp }}/setstack-gradle.log
          if-no-files-found: warn
          retention-days: 7
