name: Build CoachAura debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Record exact build source
        shell: bash
        run: |
          printf 'Source commit: %s\nBranch: %s\nRun attempt: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ATTEMPT"
          {
            echo '## CoachAura Android build source'
            printf 'Source commit: %s\n\nBranch: %s\n\nRun attempt: %s\n\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ATTEMPT"
            echo 'For the latest app, start Run workflow on main. Re-running an older job rebuilds its original commit.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v5
        with:
          version: 10.26.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK 36
        shell: bash
        run: node artifacts/setstack/scripts/setup-android-ci.mjs 2>&1 | tee "$RUNNER_TEMP/setstack-android-sdk.log"
      - name: Reuse the test signing key across builds
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: setstack-debug-keystore-${{ github.repository_id }}-v1
      - run: pnpm install --frozen-lockfile
      - name: Check calculation and data regressions
        run: |
          node --test artifacts/setstack/scripts/setup-android-ci.test.mjs
          node --test artifacts/setstack/scripts/verify-android-upgrade.test.mjs
          pnpm --filter @workspace/setstack run test:unit
      - name: Build and sync the bundled web app
        run: pnpm --filter @workspace/setstack run android:sync
      - name: Build debug APK
        working-directory: artifacts/setstack/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/setstack-gradle.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify signature and compatibility with the installed test APK
        working-directory: artifacts/setstack
        run: node scripts/verify-android-upgrade.mjs
      - name: Downloadable APK
        uses: actions/upload-artifact@v6
        with:
          name: CoachAura-debug-APK-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/setstack/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Downloadable failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: CoachAura-debug-build-logs
          path: |
            ${{ runner.temp }}/setstack-android-sdk.log
            ${{ runner.temp }}/setstack-gradle.log
          if-no-files-found: warn
          retention-days: 7
